name: SDRSentinel Package Builds (Windows, macOS, Ubuntu)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # ==========================================
  # Windows Package Build (vcpkg x64)
  # ==========================================
  package-windows:
    name: Windows x64 Package
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '2024.01.12'

      - name: Configure CMake (vcpkg manifest)
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DOPT_BUILD_RF_TOOLS=ON
          -DOPT_BUILD_KRAKEN_DOA=ON
          -DCOPY_MSVC_REDISTRIBUTABLES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows Binary
        run: powershell -ExecutionPolicy Bypass -File ./packaging/windows/make_windows_package.ps1 ./build ./root

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdrsentinel-windows-x64
          path: |
            sdrsentinel_windows_x64.zip
            sdrpp_windows_x64.zip

  # ==========================================
  # macOS App Bundle Package (arm64 & x86_64)
  # ==========================================
  package-macos:
    name: macOS Package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew update
          brew install pkg-config libusb fftw glfw eigen portaudio zstd ninja

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPT_BUILD_RF_TOOLS=ON
          -DOPT_BUILD_KRAKEN_DOA=ON
          -DOPT_BUILD_PORTAUDIO_SINK=ON
          -DOPT_BUILD_NEW_PORTAUDIO_SINK=ON
          -DUSE_BUNDLE_DEFAULTS=ON

      - name: Build
        run: ninja -C build

      - name: Create macOS App Bundle
        run: |
          sh packaging/macos/make_macos_bundle.sh build ./SDRSentinel.app
          zip -r "sdrsentinel-macos-${{ matrix.arch }}.zip" SDRSentinel.app

      - name: Upload macOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdrsentinel-macos-${{ matrix.arch }}
          path: sdrsentinel-macos-${{ matrix.arch }}.zip

  # ==========================================
  # Ubuntu Package Build (.deb for 22.04 & 24.04)
  # ==========================================
  package-ubuntu:
    name: Ubuntu Package (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            distro: noble
          - runner: ubuntu-22.04
            distro: jammy
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libfftw3-dev libglfw3-dev libvolk2-dev libzstd-dev \
            libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev \
            libportaudio2 portaudio19-dev libeigen3-dev libusb-1.0-0-dev

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPT_BUILD_RF_TOOLS=ON
          -DOPT_BUILD_KRAKEN_DOA=ON
          -DOPT_BUILD_PORTAUDIO_SINK=ON
          -DOPT_BUILD_NEW_PORTAUDIO_SINK=ON
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: ninja -C build

      - name: Create Debian / Ubuntu Package
        run: |
          BUILD_NO="-${{ github.run_number }}" sh packaging/linux/make_debian_package.sh build "libfftw3-bin, libglfw3, libportaudio2, libzstd1, libusb-1.0-0"
          mv sdrsentinel_debian_amd64.deb "sdrsentinel_ubuntu_${{ matrix.distro }}_amd64.deb"

      - name: Upload Ubuntu Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdrsentinel-ubuntu-${{ matrix.distro }}-amd64
          path: sdrsentinel_ubuntu_${{ matrix.distro }}_amd64.deb

  # ==========================================
  # GitHub Release Publishing (on Tag)
  # ==========================================
  publish-release:
    name: Publish Release Packages
    needs: [package-windows, package-macos, package-ubuntu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download All Package Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
